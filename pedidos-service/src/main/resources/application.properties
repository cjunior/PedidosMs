spring.application.name=pedidos-service
server.port=${SERVER_PORT:8083}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pedidosdb}
spring.datasource.username=${DB_USER:pedidos}
spring.datasource.password=${DB_PASSWORD:pedidos}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

clientes.service.url=${CLIENTES_SERVICE_URL:http://localhost:8081}
estoque.service.url=${ESTOQUE_SERVICE_URL:http://localhost:8082}
