spring.application.name=pedidos-service
server.port=${SERVER_PORT:8083}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pedidosdb}
spring.datasource.username=${DB_USER:pedidos}
spring.datasource.password=${DB_PASSWORD:pedidos}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

clientes.service.url=${CLIENTES_SERVICE_URL:http://localhost:8081}
estoque.service.url=${ESTOQUE_SERVICE_URL:http://localhost:8082}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=pedidos-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
loja.kafka.topics.pedido-concluido=pedido-concluido
loja.kafka.topics.estoque-debitado=estoque-debitado
loja.kafka.topics.estoque-debito-falhou=estoque-debito-falhou
